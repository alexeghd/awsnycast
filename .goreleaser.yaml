# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: awsnycast

before:
  hooks:
    - go mod tidy
    - go generate ./...

snapshot:
  version_template: "{{ incpatch .Version }}-devel-{{ .ShortCommit }}"

builds:
  - id: awsnycast-bin
    binary: awsnycast
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - id: awsnycast-arc
    builds:
      - awsnycast-bin
    name_template:  "awsnycast_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: ["none*"]

nfpms:
  - id: awsnycast-pkg
    package_name: awsnycast
    builds: [awsnycast-bin]
    license: Apache 2.0
    vendor: "Alex Eghd"
    homepage: "https://github.com/alexeghd/awsnycast"
    maintainer: "Alex Eghd <alexeghd+awsnycast@gmail.com>"
    description: |-
      AWSnycast is a routing daemon for AWS route tables, to simulate an Anycast like service, and act as an extension of in-datacenter Anycast. It can also be used to provide HA NAT service.
    formats:
      - deb
      - rpm

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?bug(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  ids:
  - awsnycast-arc
  - awsnycast-pkg
  name_template: "Release v{{.Version}}"

signs:
  - artifacts: checksum
    cmd: gpg2
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
